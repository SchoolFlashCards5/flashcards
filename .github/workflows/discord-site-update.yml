name: Game Change Webhook

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          COMMITTER: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          import urllib.error
          from collections import Counter

          webhook_url = os.environ["WEBHOOK_URL"]
          before_sha = os.environ["BEFORE_SHA"]
          after_sha = os.environ["AFTER_SHA"]
          repo = os.environ["REPO"]
          committer = os.environ["COMMITTER"]

          file_path = "games.html"

          def read_file_at_sha(sha, path):
              if not sha or sha == "0000000000000000000000000000000000000000":
                  return ""
              try:
                  return subprocess.check_output(
                      ["git", "show", f"{sha}:{path}"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return ""

          before_text = read_file_at_sha(before_sha, file_path)
          after_text = read_file_at_sha(after_sha, file_path)

          # -------------------------
          # Detect game changes
          # -------------------------

          game_re = re.compile(
              r'<div class="game-card">.*?<h3 class="game-title">(.*?)</h3>',
              re.S | re.I
          )

          before_games = Counter(game_re.findall(before_text))
          after_games = Counter(game_re.findall(after_text))

          messages = []

          for title, count in after_games.items():
              diff = count - before_games.get(title, 0)
              for _ in range(diff):
                  messages.append(f'🎮 A game "{title}" has been added.')

          for title, count in before_games.items():
              diff = count - after_games.get(title, 0)
              for _ in range(diff):
                  messages.append(f'🗑️ A game "{title}" has been removed.')

          # -------------------------
          # Detect status change
          # -------------------------

          def get_status(html):
              match = re.search(
                  r'<section class="hero".*?<b>(.*?)</b>',
                  html,
                  re.S | re.I
              )
              if not match:
                  return ""
              return re.sub(r"\s+", " ", match.group(1)).strip()

          old_status = get_status(before_text)
          new_status = get_status(after_text)

          if old_status != new_status:
              if old_status and new_status:
                  messages.append(
                      f'📢 Status updated to: "{new_status}"'
                  )
              elif new_status:
                  messages.append(
                      f'📢 Status added: "{new_status}"'
                  )
              else:
                  messages.append(
                      '📢 Status removed.'
                  )

          # -------------------------
          # Nothing changed
          # -------------------------

          if not messages:
              print("No relevant changes detected.")
              raise SystemExit(0)

          change_text = "\n".join(messages)

          content = (
              f"**Site updated in `{repo}`**\n"
              f"**Pushed by:** {committer}\n\n"
              f"**Changes pushed:**\n"
              f"```text\n"
              f"{change_text}\n"
              f"```\n"
              f"@here"
          )

          payload = json.dumps({
              "content": content,
              "allowed_mentions": {
                  "parse": ["everyone"]
              }
          }).encode("utf-8")

          req = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode('utf-8', 'ignore')}")
              raise
          PY
