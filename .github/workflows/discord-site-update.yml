name: Game Change Webhook

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect added/removed games and notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          COMMITTER: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import subprocess
          import urllib.request
          import urllib.error
          from collections import Counter

          webhook_url = os.environ["WEBHOOK_URL"]
          before_sha = os.environ["BEFORE_SHA"]
          after_sha = os.environ["AFTER_SHA"]
          repo = os.environ["REPO"]
          committer = os.environ["COMMITTER"]

          file_path = "games.html"

          def read_file_at_sha(sha: str, path: str) -> str:
              if not sha or sha == "0000000000000000000000000000000000000000":
                  return ""
              try:
                  return subprocess.check_output(
                      ["git", "show", f"{sha}:{path}"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return ""

          before_text = read_file_at_sha(before_sha, file_path)
          after_text = read_file_at_sha(after_sha, file_path)

          title_re = re.compile(
              r'<div class="game-card">.*?<h3 class="game-title">(.*?)</h3>',
              re.S
          )

          before_titles = Counter(title_re.findall(before_text))
          after_titles = Counter(title_re.findall(after_text))

          added = []
          removed = []

          for title, count in after_titles.items():
              delta = count - before_titles.get(title, 0)
              if delta > 0:
                  added.extend([title] * delta)

          for title, count in before_titles.items():
              delta = count - after_titles.get(title, 0)
              if delta > 0:
                  removed.extend([title] * delta)

          messages = []
          for title in added:
              messages.append(f'A game "{title}" has been added.')
          for title in removed:
              messages.append(f'A game "{title}" has been removed.')

          if not messages:
              print("No game-card changes detected.")
              raise SystemExit(0)

          change_text = "\n".join(messages)

          content = (
              f"**Site updated in `{repo}`**\n"
              f"**Pushed by:** {committer}\n\n"
              f"**Changes pushed:**\n"
              f"```text\n{change_text}\n```\n"
              f"@here"
          )

          payload = json.dumps({"content": content}).encode("utf-8")

          req = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0"
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode('utf-8', 'ignore')}")
              raise
          PY
