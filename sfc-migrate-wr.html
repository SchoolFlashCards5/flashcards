<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- ============================================================
  SCHOOLFLASHCARDS5 — sfc-migrate-wr.html
  ONE-TIME USE TOOL. Uploads the original submission instructions,
  the 13 existing records, and the cheaters list into Firestore
  (site/wr), so you don't have to re-type them into sfc-admin.html.

  HOW TO USE:
    1. Log in with your admin account.
    2. Click "Import World Records". Wait for it to finish.
    3. Open sfc-admin.html's World Records tab to confirm.
    4. Delete this file — running it twice would overwrite whatever
       you've since edited (it warns you first).
============================================================ -->

<title>SchoolFlashCards5 — Migrate World Records (one-time)</title>
<style>
:root { --primary:#4ECDC4; --accent:#FFE66D; --dark:#292F36; --light:#F7FFF7; --button:#FF6B6B; }
* { margin:0; padding:0; box-sizing:border-box; font-family:"Comic Sans MS", cursive, sans-serif; }
body { background: var(--light); color: var(--dark); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.box { max-width:460px; width:100%; background:white; border-radius:12px; padding:32px; margin:20px; box-shadow:0 3px 14px rgba(0,0,0,0.1); }
h1 { font-size:20px; color:var(--dark); margin-bottom:8px; }
p { color:#777; font-size:14px; margin-bottom:18px; line-height:1.5; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:13px; font-weight:bold; color:var(--dark); margin-bottom:5px; }
.field input { width:100%; border:2px solid #e2e2e2; color:var(--dark); font-family:inherit; font-size:15px; padding:9px 12px; border-radius:8px; outline:none; }
.field input:focus { border-color:var(--primary); }
button { background:var(--button); border:none; color:white; font-family:inherit; font-weight:bold; font-size:15px; padding:11px 20px; border-radius:8px; cursor:pointer; width:100%; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.status { margin-top:16px; font-size:14px; font-weight:bold; white-space:pre-line; line-height:1.6; }
.status.ok { color:#1a8a4a; }
.status.err { color:#d64545; }
.status.warn { color:#c98a00; }
#importPanel { display:none; }
.error-box { background:#ffe3e3; border:1px solid #ffb3b3; color:#a11; font-size:13px; font-weight:bold; padding:9px 12px; border-radius:8px; margin-bottom:14px; display:none; }
</style>
</head>
<body>
<div class="box">

  <div id="loginPanel">
    <h1>Admin Login Required</h1>
    <p>Sign in with your admin account to run the import.</p>
    <div class="error-box" id="loginError"></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"/></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword"/></div>
    <button id="loginBtn">Sign In</button>
  </div>

  <div id="importPanel">
    <h1>Import World Records</h1>
    <p>Uploads the original submission instructions, 13 records, and cheaters list into Firestore. Safe to run once — it warns you before overwriting anything already there.</p>
    <button id="importBtn">Import World Records</button>
    <div class="status" id="status"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyC3jxwyH9Pws4nhIT9ScDffk5CpHa99oMM",
    authDomain: "pinkgame-1d4bf.firebaseapp.com",
    projectId: "pinkgame-1d4bf",
    storageBucket: "pinkgame-1d4bf.firebasestorage.app",
    messagingSenderId: "531941128309",
    appId: "1:531941128309:web:82e55394c6f48666a3603c",
    measurementId: "G-WF5YT7S04W"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const WR_REF = doc(db, 'site', 'wr');

  const loginPanel = document.getElementById('loginPanel');
  const importPanel = document.getElementById('importPanel');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginError.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = 'Sign-in failed — check the email and password.';
      loginError.style.display = 'block';
    }
  });

  onAuthStateChanged(auth, (user) => {
    loginPanel.style.display = user ? 'none' : 'block';
    importPanel.style.display = user ? 'block' : 'none';
  });

  // The original World Records page content, ready to write straight
  // into site/wr. "Discord" mentions in the instructions were turned
  // into real Markdown links so they still work once rendered.
  const wrData = {"intro": "If you want to have your record on here, join the [Discord](https://discord.gg/GnVUkcsfMw) or email (slower response time) 31detzac@hayward.k12.wi.us with your new best/best screen, along with tabs and url showing. (email schoolflashcardsgh@gmail.com or use [Discord](https://discord.gg/GnVUkcsfMw) if you are at home)", "records": ["Carter  Fromell - 157 in Candy Jump", "Wesley Johnson - 476 in Crossy Road", "Feather Henry - 1 in Fruit Ninja.", "Jayson Heynkel - 988,989 in Subway Surfers", "Colt Achtor - 136 in Flappy Bird", "Jayson Henkel - First to complete all cardboard box levels, with three stars, in Cut the Rope", "Evan Grahn - 227 in Slope", "Ryerson Poquette - 8192 brick in 2048", "Charles Seeger - 266 in Snow Rider 3D.", "Rylan Begay-Beaulieu - 9,197 meters in Jetpack Joyride", "Benjamin St. Germaine - First to get every single box 3 stars on cut the rope (UNBEATABLE)", "Kaieden Shearin - First to bet OvO all levels with all coins (UNBEATABLE)", "Zachary D - Expert Mode Minesweeper completed in 291 seconds"], "cheaters": "Colt Achtor, Jayelon Olson, Wyatt Harvey"}
;

  const importBtn = document.getElementById('importBtn');
  const statusEl = document.getElementById('status');

  importBtn.addEventListener('click', async () => {
    statusEl.className = 'status';
    statusEl.textContent = 'Checking for existing data…';
    importBtn.disabled = true;

    try {
      const snap = await getDoc(WR_REF);
      if (snap.exists() && Object.keys(snap.data()).length > 0) {
        const proceed = confirm(
          `site/wr already has data in it.\n\n` +
          `Importing will OVERWRITE the instructions, records, and cheaters list ` +
          `with the original versions — any edits you've made since will be lost.\n\n` +
          `Continue anyway?`
        );
        if (!proceed) {
          statusEl.className = 'status warn';
          statusEl.textContent = 'Import cancelled.';
          importBtn.disabled = false;
          return;
        }
      }

      statusEl.textContent = 'Uploading…';
      await setDoc(WR_REF, wrData);

      statusEl.className = 'status ok';
      statusEl.textContent = `Done! Imported the instructions, ${wrData.records.length} records, and the cheaters list.\nYou can now delete this file and use sfc-admin.html's World Records tab from here on.`;
    } catch (err) {
      console.error(err);
      statusEl.className = 'status err';
      statusEl.textContent = 'Import failed — check your Firestore rules allow writes for logged-in users, and check your connection.';
    } finally {
      importBtn.disabled = false;
    }
  });
</script>
</body>
</html>
